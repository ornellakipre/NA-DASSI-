<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<meta name="theme-color" content="#14684A">
<meta name="color-scheme" content="light dark">
<title>NA DASSI</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: carnet de comptes de poche. Bande verte avec le reste du mois en grand, cartes par poste, barre d'onglets en bas. */
:root {
  --bg: #F1F5F0;
  --surface: #FFFFFF;
  --ink: #12281F;
  --muted: #566A60;
  --line: #D9E2DB;
  --primary: #14684A;
  --on-primary: #FFFFFF;
  --accent: #C85A08;
  --danger: #B3261E;
  --c-besoins: #14684A;
  --c-envies: #3F6FB5;
  --c-epargne: #C85A08;
  --tint: #E3EEE7;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1713; --surface: #14231D; --ink: #E6EEE9; --muted: #92A89D; --line: #243830;
    --primary: #4FC08D; --on-primary: #06150F; --accent: #F59A4B; --danger: #FF8A80;
    --c-besoins: #4FC08D; --c-envies: #7BA6E8; --c-epargne: #F59A4B; --tint: #1B3128;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1713; --surface: #14231D; --ink: #E6EEE9; --muted: #92A89D; --line: #243830;
  --primary: #4FC08D; --on-primary: #06150F; --accent: #F59A4B; --danger: #FF8A80;
  --c-besoins: #4FC08D; --c-envies: #7BA6E8; --c-epargne: #F59A4B; --tint: #1B3128;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
body { overflow-x: hidden; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-top: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* header band */
.top { background: var(--primary); color: var(--on-primary); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; letter-spacing: 0.01em; }
.month { display: flex; align-items: center; gap: 4px; }
.month span { min-width: 7.5em; text-align: center; font-weight: 600; text-transform: capitalize; }
.icon-btn { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 10px; width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer; }
.label-up { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.05; }
.top-stats { display: flex; gap: 20px; flex-wrap: wrap; }
.top-stats b { display: block; font-size: 1.05rem; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.notice { background: var(--tint); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }
.alert { border-left: 4px solid var(--danger); background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* split bar and rows */
.split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); }
.split i { display: block; height: 100%; }
.post { display: flex; flex-direction: column; gap: 6px; }
.post-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.bar.over > span { background: var(--danger); }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width 0.35s ease; } }

/* lists */
.list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item:last-child { padding-bottom: 0; }
.item-main { min-width: 0; flex: 1 1 150px; display: flex; flex-direction: column; gap: 2px; }
.item-main b { overflow-wrap: anywhere; }
.item-main .num { white-space: normal; }
.item-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--tint); color: var(--ink); white-space: nowrap; }
.pill.paid { background: var(--primary); color: var(--on-primary); }
.pill.late { background: var(--danger); color: #fff; }
:root[data-theme="dark"] .pill.late { color: #1a0605; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.late { color: #1a0605; } }
.pill.soon { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .pill.soon { color: #1d0f02; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.soon { color: #1d0f02; } }

/* forms */
form, .fields { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; color: var(--muted); min-width: 0; }
input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 0.88rem; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.msg { color: var(--danger); font-size: 0.88rem; min-height: 0; }
.msg:empty { display: none; }
.msg.ok { color: var(--primary); font-weight: 600; }
.row-inline { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.row-inline input { flex: 1 1 120px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); z-index: 5; }
.nav-in { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 560px; }
.tab { font: inherit; font-size: 0.74rem; font-weight: 600; background: transparent; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; cursor: pointer; min-height: 48px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--primary); background: var(--tint); }
.foot { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 4px 0; }
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Mon Budget</div>
      <div class="month">
        <button class="icon-btn" data-act="prev" aria-label="Mois précédent">&#8249;</button>
        <span id="month-label"></span>
        <button class="icon-btn" data-act="next" aria-label="Mois suivant">&#8250;</button>
      </div>
    </div>
    <div>
      <div class="label-up" id="hero-label">Reste ce mois-ci</div>
      <div class="big num" id="hero-left"></div>
    </div>
    <div class="top-stats">
      <div><span class="label-up">Revenu</span><b class="num" id="hero-income"></b></div>
      <div><span class="label-up">Sorti</span><b class="num" id="hero-spent"></b></div>
      <div><span class="label-up">Mis de côté</span><b class="num" id="hero-saved"></b></div>
    </div>
    <p class="small" id="mode-note" role="status" style="opacity:0.92"></p>
  </header>
  <div id="sample-note"></div>
  <main id="view" class="wrap" style="padding-top:0"></main>
  <p class="foot">Mon Budget · version de test</p>
</div>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <button class="tab" data-tab="apercu"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Aperçu</button>
    <button class="tab" data-tab="depenses"><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12l1 3M16 13.5h3"/></svg>Dépenses</button>
    <button class="tab" data-tab="echeances"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Échéances</button>
    <button class="tab" data-tab="epargne"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1 1.3-1.8 3-1.8s3 .8 3 1.8-1.3 1.6-3 2-3 1-3 2 1.3 1.8 3 1.8 3-.8 3-1.8"/></svg>Épargne</button>
  </div>
</nav>

<script>
(function () {
  var LS = "mon-budget-v1";
  var CATS = {
    loyer: { label: "Loyer", g: "besoins" },
    alim: { label: "Alimentation", g: "besoins" },
    transport: { label: "Transport", g: "besoins" },
    factures: { label: "Factures (CIE, eau, internet)", g: "besoins" },
    sante: { label: "Santé", g: "besoins" },
    sorties: { label: "Sorties et restos", g: "envies" },
    loisirs: { label: "Loisirs", g: "envies" },
    shopping: { label: "Shopping", g: "envies" },
    epargne: { label: "Épargne", g: "epargne" }
  };
  var GROUPS = {
    besoins: { label: "Besoins", sub: "loyer, nourriture, transport, factures", color: "var(--c-besoins)" },
    envies: { label: "Envies", sub: "sorties, loisirs, shopping", color: "var(--c-envies)" },
    epargne: { label: "Épargne", sub: "ce que tu mets de côté", color: "var(--c-epargne)" }
  };

  /* ---------- helpers ---------- */
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var ymd = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  var money = function (n) { return nf.format(Math.round(n || 0)) + " FCFA"; };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var uid = function () { return Math.random().toString(36).slice(2, 9); };
  var daysIn = function (y, m) { return new Date(y, m, 0).getDate(); };
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- state ---------- */
  function sampleState() {
    var ym = ymd(today).slice(0, 7);
    var y = today.getFullYear(), m = today.getMonth() + 1, td = today.getDate();
    var day = function (n) { return ym + "-" + pad(Math.min(n, td)); };
    var loyerId = uid(), cieId = uid(), eauId = uid(), netId = uid();
    var goalDate = new Date(y, today.getMonth() + 4, Math.min(td, 28));
    var s = {
      v: 1, sample: true, income: 250000, incomeFreq: "month",
      catBudgets: { alim: 40000, transport: 15000, sorties: 20000 },
      split: { besoins: 50, envies: 30, epargne: 20 },
      dues: [
        { id: loyerId, label: "Loyer", amount: 75000, day: 5, cat: "loyer" },
        { id: netId, label: "Internet", amount: 20000, day: 10, cat: "factures" },
        { id: cieId, label: "Électricité (CIE)", amount: 12000, day: 15, cat: "factures" },
        { id: eauId, label: "Eau (SODECI)", amount: 5000, day: 20, cat: "factures" }
      ],
      expenses: [
        { id: uid(), label: "Courses du marché", amount: 18000, cat: "alim", date: day(2) },
        { id: uid(), label: "Taxi et woro-woro", amount: 6500, cat: "transport", date: day(3) },
        { id: uid(), label: "Sortie avec les amis", amount: 9000, cat: "sorties", date: day(4) }
      ],
      goals: [
        { id: uid(), label: "Nouveau téléphone", target: 150000, saved: 30000, date: ymd(goalDate) }
      ]
    };
    if (td >= 5) s.expenses.push({ id: uid(), label: "Loyer", amount: 75000, cat: "loyer", date: day(5), dueId: loyerId });
    return s;
  }
  var state = sampleState();
  var viewMonth = ymd(today).slice(0, 7);
  var tab = "apercu";

  /* ---------- persistence (téléphone uniquement) ---------- */
  var memoryOnly = false, ready = true, dirty = false;
  function persist() {
    dirty = true;
    try { localStorage.setItem(LS, JSON.stringify(state)); memoryOnly = false; }
    catch (e) { memoryOnly = true; }
    var d = new Date();
    $("#mode-note").textContent = memoryOnly
      ? "Impossible d\u2019enregistrer sur cet appareil (navigation privée ?). Les données seront perdues à la fermeture."
      : "Enregistré sur ton téléphone à " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ".";
  }
  function modeNote() { $("#mode-note").textContent = "Tes données restent sur ton téléphone."; }

  /* ---------- computations ---------- */
  function monthExpenses() { return state.expenses.filter(function (e) { return e.date.slice(0, 7) === viewMonth; }); }
  function groupSpent() {
    var r = { besoins: 0, envies: 0, epargne: 0 };
    monthExpenses().forEach(function (e) { var g = (CATS[e.cat] || { g: "envies" }).g; r[g] += e.amount; });
    return r;
  }
  var WEEKS = 52 / 12;
  function monthlyIncome() { var i = state.income || 0; return state.incomeFreq === "week" ? i * WEEKS : i; }
  function budgetOf(g) { return monthlyIncome() * (state.split[g] || 0) / 100; }
  function weekBounds() {
    var d = new Date(today), dow = (d.getDay() + 6) % 7;
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    return { start: ymd(start), end: ymd(end) };
  }
  function weekSpent() {
    var w = weekBounds();
    return state.expenses.filter(function (e) { return e.cat !== "epargne" && e.date >= w.start && e.date <= w.end; }).reduce(function (a, e) { return a + e.amount; }, 0);
  }
  function weeklyAllowance() { return monthlyIncome() * ((state.split.besoins || 0) + (state.split.envies || 0)) / 100 / WEEKS; }
  function dueInfo(d) {
    var p = viewMonth.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, Math.min(d.day, daysIn(p[0], p[1])));
    var paid = state.expenses.some(function (e) { return e.dueId === d.id && e.date.slice(0, 7) === viewMonth; });
    return { dt: dt, paid: paid, diff: Math.round((dt - today) / 864e5) };
  }
  function monthLabel() {
    var p = viewMonth.split("-").map(Number);
    return new Date(p[0], p[1] - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  }
  function newExpenseDate() {
    var p = viewMonth.split("-").map(Number);
    if (viewMonth === ymd(today).slice(0, 7)) return ymd(today);
    return viewMonth + "-" + pad(Math.min(today.getDate(), daysIn(p[0], p[1])));
  }
  function dateFr(s) {
    var p = s.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }
  function catOptions(sel) {
    return Object.keys(CATS).map(function (k) { return '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + esc(CATS[k].label) + "</option>"; }).join("");
  }
  function duePill(info) {
    if (info.paid) return '<span class="pill paid">Payé</span>';
    if (info.diff < 0) return '<span class="pill late">En retard de ' + (-info.diff) + " j</span>";
    if (info.diff === 0) return '<span class="pill soon">Aujourd’hui</span>';
    if (info.diff === 1) return '<span class="pill soon">Demain</span>';
    if (info.diff <= 3) return '<span class="pill soon">Dans ' + info.diff + " j</span>";
    return '<span class="pill">Dans ' + info.diff + " j</span>";
  }

  function catSpent(k) {
    return monthExpenses().filter(function (e) { return e.cat === k; }).reduce(function (a, e) { return a + e.amount; }, 0);
  }
  function catAlerts() {
    var cb = state.catBudgets || {};
    return Object.keys(cb).filter(function (k) { return CATS[k] && k !== "epargne" && cb[k] > 0; }).map(function (k) {
      var s = catSpent(k), b = cb[k];
      if (s > b) return '<div class="alert"><b>' + esc(CATS[k].label) + "</b> : budget dépassé de " + money(s - b) + ".</div>";
      if (s >= b * 0.8) return '<div class="alert" style="border-left-color:var(--accent)"><b>' + esc(CATS[k].label) + "</b> : " + Math.round(s / b * 100) + " % du budget utilisé. Il reste " + money(b - s) + ".</div>";
      return "";
    }).join("");
  }
  function viewBudgets() {
    var cb = state.catBudgets || {};
    var rows = Object.keys(CATS).filter(function (k) { return k !== "epargne"; }).map(function (k) {
      var b = cb[k] || 0, s = catSpent(k);
      var pct = b > 0 ? Math.min(100, s / b * 100) : 0, over = b > 0 && s > b;
      return '<div class="post"><div class="post-top"><label style="flex:1 1 150px">' + esc(CATS[k].label) + '<input id="cb-' + k + '" name="cb-' + k + '" type="number" inputmode="numeric" min="0" step="1" value="' + (b || "") + '" placeholder="Budget en FCFA"></label><span class="small muted num">' + (b > 0 ? money(s) + " / " + money(b) : money(s) + " dépensés") + "</span></div>" +
        (b > 0 ? '<div class="bar' + (over ? " over" : "") + '" style="--c:' + GROUPS[CATS[k].g].color + '"><span style="width:' + pct.toFixed(1) + '%"></span></div>' : "") + "</div>";
    }).join("");
    return '<section class="card"><div class="card-head"><h2>Budget par catégorie</h2><span class="small muted">Par mois. Laisse vide pour ne pas fixer de limite</span></div><form data-form="budgets" novalidate>' + rows + '<p class="msg ok" role="status" id="ok-budgets"></p><button class="btn" type="submit">Enregistrer les budgets</button></form></section>';
  }

  /* ---------- views ---------- */
  function renderHero() {
    var gs = groupSpent();
    var spent = gs.besoins + gs.envies + gs.epargne;
    var left = monthlyIncome() - spent;
    $("#month-label").textContent = monthLabel();
    $("#hero-left").textContent = money(left);
    $("#hero-left").style.color = left < 0 ? "#FFD2CC" : "inherit";
    $("#hero-label").textContent = left < 0 ? "Tu dépasses ton revenu de" : "Reste ce mois-ci";
    if (left < 0) $("#hero-left").textContent = money(-left);
    $("#hero-income").textContent = (state.incomeFreq === "week" ? "≈ " : "") + money(monthlyIncome());
    $("#hero-spent").textContent = money(gs.besoins + gs.envies);
    $("#hero-saved").textContent = money(gs.epargne);
    $("#sample-note").innerHTML = state.sample
      ? '<div class="notice"><p><b>Ce sont des chiffres d’exemple.</b> Modifie-les pour voir comment ça marche, puis repars de zéro quand tu es prêt.</p><div><button class="btn small" data-act="clear-sample">Commencer avec mes données</button></div></div>'
      : "";
    document.querySelectorAll(".tab").forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
  }

  function weekCard() {
    var allow = weeklyAllowance(), sp = weekSpent();
    var pct = allow > 0 ? Math.min(100, sp / allow * 100) : 0, over = sp > allow;
    var w = weekBounds();
    return '<section class="card"><div class="card-head"><h2>Cette semaine</h2><span class="small muted">' + dateFr(w.start) + " au " + dateFr(w.end) + '</span></div>' +
      '<div class="bar' + (over ? " over" : "") + '" style="--c:var(--c-besoins)"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
      '<p class="small">' + money(sp) + " dépensés sur " + money(allow) + " prévus. " + (over ? "Tu dépasses de " + money(sp - allow) + "." : "Il te reste <b>" + money(allow - sp) + "</b>.") + "</p></section>";
  }

  function viewApercu() {
    var gs = groupSpent();
    var inc = monthlyIncome();
    var sp = state.split;
    var sum = (sp.besoins || 0) + (sp.envies || 0) + (sp.epargne || 0);
    var alerts = ["besoins", "envies"].filter(function (g) { return gs[g] > budgetOf(g) && (budgetOf(g) > 0 || gs[g] > 0); }).map(function (g) {
      return '<div class="alert"><b>' + GROUPS[g].label + "</b> : " + money(gs[g] - budgetOf(g)) + " au-dessus de ton budget.</div>";
    }).join("");
    var posts = ["besoins", "envies", "epargne"].map(function (g) {
      var b = budgetOf(g), s = gs[g];
      var pct = b > 0 ? Math.min(100, s / b * 100) : (s > 0 ? 100 : 0);
      var over = g !== "epargne" && s > b;
      var line = g === "epargne"
        ? money(s) + " mis de côté sur " + money(b) + " prévus"
        : money(s) + " dépensés sur " + money(b) + (over ? "" : " (reste " + money(b - s) + ")");
      return '<div class="post"><div class="post-top"><b><span class="dot" style="background:' + GROUPS[g].color + '"></span>' + GROUPS[g].label + " " + (sp[g] || 0) + ' %</b><span class="small muted num">' + money(b) + '</span></div><div class="bar' + (over ? " over" : "") + '" style="--c:' + GROUPS[g].color + '"><span style="width:' + pct.toFixed(1) + '%"></span></div><p class="small muted">' + line + "</p></div>";
    }).join("");
    var splitBar = ["besoins", "envies", "epargne"].map(function (g) { return '<i style="width:' + (sp[g] || 0) + "%;background:" + GROUPS[g].color + '"></i>'; }).join("");
    var ups = state.dues.map(function (d) { return { d: d, i: dueInfo(d) }; }).filter(function (x) { return !x.i.paid; }).sort(function (a, b) { return a.i.diff - b.i.diff; }).slice(0, 3);
    var upHtml = ups.length
      ? '<ul class="list">' + ups.map(function (x) {
        return '<li class="item"><div class="item-main"><b>' + esc(x.d.label) + '</b><span class="small muted">Le ' + x.d.day + " du mois</span></div><div class=\"item-side\"><b class=\"num\">" + money(x.d.amount) + "</b>" + duePill(x.i) + "</div></li>";
      }).join("") + "</ul>"
      : '<p class="muted">Rien à payer pour le moment.</p>';
    return (
      (inc <= 0 ? '<div class="notice"><p>Entre ton revenu du mois ci-dessous pour voir la répartition.</p></div>' : "") +
      alerts + catAlerts() +
      '<section class="card"><div class="card-head"><h2>Ton revenu</h2></div><form data-form="income" novalidate>' +
      '<div class="grid2"><label>Je perçois<select id="income-freq" name="freq"><option value="month"' + (state.incomeFreq === "week" ? "" : " selected") + '>Chaque mois</option><option value="week"' + (state.incomeFreq === "week" ? " selected" : "") + '>Chaque semaine</option></select></label>' +
      '<label>Montant (FCFA)<input id="income" name="income" type="number" inputmode="numeric" min="0" step="1" value="' + (state.income || "") + '" placeholder="Ex. 250000"></label></div>' +
      (inc > 0 ? '<p class="small muted">' + (state.incomeFreq === "week" ? "Soit environ <b>" + money(inc) + "</b> par mois (52 semaines par an, donc 4,33 semaines par mois). " : "") + "Pour tes besoins et tes envies, vise environ <b>" + money(weeklyAllowance()) + "</b> par semaine.</p>" : "") +
      '<p class="msg ok" role="status" id="ok-income"></p><button class="btn" type="submit">Enregistrer le revenu</button></form></section>' +
      (inc > 0 ? weekCard() : "") +
      '<section class="card"><div class="card-head"><h2>Ta répartition</h2><span class="small muted">' + sp.besoins + " / " + sp.envies + " / " + sp.epargne + "</span></div><div class=\"split\">" + splitBar + "</div>" + posts + "</section>" +
      viewBudgets() + '<section class="card"><div class="card-head"><h2>À payer bientôt</h2><button class="btn ghost small" data-tab="echeances">Tout voir</button></div>' + upHtml + "</section>" +
      '<section class="card"><div class="card-head"><h2>Changer la règle</h2><span class="small muted">Par défaut : 50 / 30 / 20</span></div><form data-form="split" novalidate><div class="grid3">' +
      '<label>Besoins %<input name="split-besoins" type="number" inputmode="numeric" min="0" max="100" value="' + sp.besoins + '"></label>' +
      '<label>Envies %<input name="split-envies" type="number" inputmode="numeric" min="0" max="100" value="' + sp.envies + '"></label>' +
      '<label>Épargne %<input name="split-epargne" type="number" inputmode="numeric" min="0" max="100" value="' + sp.epargne + "\"></label></div><p class=\"small " + (sum === 100 ? "muted" : "") + '" ' + (sum === 100 ? "" : 'style="color:var(--danger)"') + ">" + (sum === 100 ? "Total : 100 %." : "Total : " + sum + " %. Le total doit faire 100 %.") + '</p><p class="msg ok" role="status" id="ok-split"></p><button class="btn" type="submit">Enregistrer la répartition</button></form></section>'
    );
  }

  function viewDepenses() {
    var list = monthExpenses().slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var total = list.reduce(function (a, e) { return a + e.amount; }, 0);
    var rows = list.length
      ? '<ul class="list">' + list.map(function (e) {
        return '<li class="item"><div class="item-main"><b>' + esc(e.label) + '</b><span class="small muted">' + dateFr(e.date) + " · " + esc((CATS[e.cat] || { label: "Autre" }).label) + '</span></div><div class="item-side"><b class="num">' + money(e.amount) + '</b><button class="btn danger small" data-act="del-exp" data-id="' + e.id + '" aria-label="Supprimer ' + esc(e.label) + '">Retirer</button></div></li>';
      }).join("") + "</ul>"
      : '<p class="muted">Aucune dépense ce mois-ci. Ajoute la première ci-dessus.</p>';
    return (
      catAlerts() + '<section class="card"><h2>Noter une dépense</h2><form data-form="exp" novalidate>' +
      '<label>Pour quoi ?<input id="exp-label" name="label" type="text" maxlength="60" placeholder="Ex. Courses, taxi, crédit téléphone" autocomplete="off"></label>' +
      '<div class="grid2"><label>Montant (FCFA)<input id="exp-amount" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="5000"></label>' +
      '<label>Catégorie<select id="exp-cat" name="cat">' + catOptions("alim") + "</select></label></div>" +
      '<p class="msg" role="alert" id="msg-exp"></p><button class="btn" type="submit">Ajouter la dépense</button></form></section>' +
      '<section class="card"><div class="card-head"><h2>Ce mois-ci</h2><b class="num">' + money(total) + "</b></div>" + rows + "</section>"
    );
  }

  function viewEcheances() {
    var items = state.dues.map(function (d) { return { d: d, i: dueInfo(d) }; }).sort(function (a, b) { return a.i.dt - b.i.dt; });
    var rest = items.filter(function (x) { return !x.i.paid; }).reduce(function (a, x) { return a + x.d.amount; }, 0);
    var rows = items.length
      ? '<ul class="list">' + items.map(function (x) {
        return '<li class="item"><div class="item-main"><b>' + esc(x.d.label) + '</b><span class="small muted num">Le ' + x.d.day + " de chaque mois · " + money(x.d.amount) + "</span>" + "</div><div class=\"item-side\">" + duePill(x.i) +
          '<button class="btn small ' + (x.i.paid ? "ghost" : "") + '" data-act="pay" data-id="' + x.d.id + '">' + (x.i.paid ? "Annuler" : "Marquer payé") + "</button>" +
          '<button class="btn danger small" data-act="del-due" data-id="' + x.d.id + '" aria-label="Supprimer ' + esc(x.d.label) + '">Retirer</button></div></li>';
      }).join("") + "</ul>"
      : '<p class="muted">Aucune échéance. Ajoute ton loyer ou une facture ci-dessous.</p>';
    return (
      '<section class="card"><div class="card-head"><h2>Agenda des paiements</h2><span class="small muted">Reste à payer : <b class="num">' + money(rest) + "</b></span></div>" + rows + "</section>" +
      '<section class="card"><h2>Ajouter une échéance</h2><form data-form="due" novalidate>' +
      '<label>Nom<input id="due-label" name="label" type="text" maxlength="60" placeholder="Ex. Loyer, CIE, tontine" autocomplete="off"></label>' +
      '<div class="grid3"><label>Montant<input id="due-amount" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="15000"></label>' +
      '<label>Jour du mois<input id="due-day" name="day" type="number" inputmode="numeric" min="1" max="31" placeholder="5"></label>' +
      '<label>Catégorie<select id="due-cat" name="cat">' + catOptions("factures") + "</select></label></div>" +
      '<p class="msg" role="alert" id="msg-due"></p><button class="btn" type="submit">Ajouter à l’agenda</button></form></section>'
    );
  }

  function monthsLeft(dateStr) {
    var p = dateStr.split("-").map(Number);
    var target = new Date(p[0], p[1] - 1, p[2]);
    return Math.max(1, Math.ceil((target - today) / 864e5 / 30.4));
  }
  function viewEpargne() {
    var rows = state.goals.length
      ? state.goals.map(function (g) {
        var pct = g.target > 0 ? Math.min(100, g.saved / g.target * 100) : 0;
        var left = Math.max(0, g.target - g.saved);
        var done = left === 0;
        var months = monthsLeft(g.date);
        var per = Math.ceil(left / months / 100) * 100;
        var info = done ? "Objectif atteint, bravo." : "Pour y arriver d’ici le " + dateFr(g.date) + " : <b>" + money(per) + "</b> à mettre de côté chaque mois.";
        return '<section class="card"><div class="card-head"><h3>' + esc(g.label) + '</h3><span class="small muted num">' + money(g.saved) + " / " + money(g.target) + "</span></div>" +
          '<div class="bar" style="--c:var(--c-epargne)"><span style="width:' + pct.toFixed(1) + '%"></span></div><p class="small">' + info + "</p>" +
          '<div class="row-inline"><input id="c-' + g.id + '" type="number" inputmode="numeric" min="1" step="1" placeholder="Montant à ajouter" aria-label="Montant à ajouter pour ' + esc(g.label) + '"><button class="btn small" data-act="contrib" data-id="' + g.id + '">Ajouter</button><button class="btn danger small" data-act="del-goal" data-id="' + g.id + '">Retirer</button></div><p class="msg" role="alert" id="msg-' + g.id + '"></p></section>';
      }).join("")
      : '<section class="card"><p class="muted">Aucun objectif pour le moment. Crée le premier ci-dessous.</p></section>';
    return (
      rows +
      '<section class="card"><h2>Nouvel objectif</h2><form data-form="goal" novalidate>' +
      '<label>Ce que tu veux financer<input id="goal-label" name="label" type="text" maxlength="60" placeholder="Ex. Voyage, urgence, moto" autocomplete="off"></label>' +
      '<div class="grid3"><label>Montant visé<input id="goal-target" name="target" type="number" inputmode="numeric" min="1" step="1" placeholder="200000"></label>' +
      '<label>Déjà de côté<input id="goal-saved" name="saved" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>' +
      '<label>Pour le<input id="goal-date" name="date" type="date" min="' + ymd(today) + '"></label></div>' +
      '<p class="msg" role="alert" id="msg-goal"></p><button class="btn" type="submit">Créer l’objectif</button></form></section>'
    );
  }

  function render() {
    renderHero();
    var v = tab === "depenses" ? viewDepenses() : tab === "echeances" ? viewEcheances() : tab === "epargne" ? viewEpargne() : viewApercu();
    $("#view").innerHTML = v;
  }
  function save() { persist(); render(); }
  function setMsg(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }
  function notReady(kind) {
    var el = kind ? (document.getElementById("ok-" + kind) || document.getElementById("msg-" + kind)) : null;
    var txt = "Chargement de tes données… réessaie dans un instant.";
    if (el) { el.textContent = txt; setTimeout(function () { if (el.isConnected && el.textContent === txt) el.textContent = ""; }, 3000); }
    else $("#mode-note").textContent = txt;
  }
  function flashOk(kind, text) {
    var el = document.getElementById("ok-" + kind);
    if (!el) return;
    el.textContent = text;
    setTimeout(function () { var e2 = document.getElementById("ok-" + kind); if (e2) e2.textContent = ""; }, 3500);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab],[data-act]");
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    var act = t.dataset.act, id = t.dataset.id;
    if (!ready && act !== "prev" && act !== "next") { notReady(act === "contrib" ? id : ""); return; }
    if (act === "prev" || act === "next") {
      var p = viewMonth.split("-").map(Number);
      var d = new Date(p[0], p[1] - 1 + (act === "next" ? 1 : -1), 1);
      viewMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1);
      render();
    } else if (act === "clear-sample") {
      state = { v: 1, sample: false, income: 0, incomeFreq: "month", catBudgets: {}, split: { besoins: 50, envies: 30, epargne: 20 }, expenses: [], dues: [], goals: [] };
      tab = "apercu"; save();
    } else if (act === "del-exp") {
      var ex = state.expenses.find(function (e) { return e.id === id; });
      if (ex && ex.goalId) { var g0 = state.goals.find(function (g) { return g.id === ex.goalId; }); if (g0) g0.saved = Math.max(0, g0.saved - ex.amount); }
      state.expenses = state.expenses.filter(function (e) { return e.id !== id; }); save();
    } else if (act === "del-due") {
      state.dues = state.dues.filter(function (d) { return d.id !== id; }); save();
    } else if (act === "del-goal") {
      state.goals = state.goals.filter(function (g) { return g.id !== id; }); save();
    } else if (act === "pay") {
      var due = state.dues.find(function (d) { return d.id === id; });
      if (!due) return;
      var info = dueInfo(due);
      if (info.paid) {
        state.expenses = state.expenses.filter(function (e) { return !(e.dueId === id && e.date.slice(0, 7) === viewMonth); });
      } else {
        state.expenses.push({ id: uid(), label: due.label, amount: due.amount, cat: due.cat, date: newExpenseDate(), dueId: id });
      }
      save();
    } else if (act === "contrib") {
      var goal = state.goals.find(function (g) { return g.id === id; });
      var inp = document.getElementById("c-" + id);
      var amt = Number(inp && inp.value);
      if (!goal || !(amt > 0)) { setMsg("msg-" + id, "Entre un montant supérieur à 0."); return; }
      goal.saved += amt;
      state.expenses.push({ id: uid(), label: "Épargne : " + goal.label, amount: amt, cat: "epargne", date: newExpenseDate(), goalId: id });
      save();
    }
  });

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest('button[type="submit"]');
    if (!b) return;
    var f = b.closest("form[data-form]");
    if (!f) return;
    ev.preventDefault();
    handleForm(f);
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    var i = ev.target.closest && ev.target.closest("input");
    var f = i && i.closest("form[data-form]");
    if (!f) return;
    ev.preventDefault();
    handleForm(f);
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target.closest("form[data-form]");
    if (!f) return;
    ev.preventDefault();
    handleForm(f);
  });
  function handleForm(f) {
    try { handleFormInner(f); } catch (e) {
      var k = f.dataset.form;
      var el = document.getElementById("ok-" + k) || document.getElementById("msg-" + k);
      if (el) el.textContent = "Erreur : " + ((e && e.message) || e);
    }
  }
  function handleFormInner(f) {
    var kind = f.dataset.form, fd = new FormData(f);
    if (!ready) { notReady(kind); return; }
    var label = String(fd.get("label") || "").trim();
    if (kind === "income") {
      state.income = Math.max(0, Number(fd.get("income")) || 0);
      state.incomeFreq = fd.get("freq") === "week" ? "week" : "month";
      save();
      return flashOk("income", "Revenu enregistré.");
    }
    if (kind === "budgets") {
      state.catBudgets = state.catBudgets || {};
      Object.keys(CATS).forEach(function (k) { if (fd.has("cb-" + k)) state.catBudgets[k] = Math.max(0, Number(fd.get("cb-" + k)) || 0); });
      save();
      return flashOk("budgets", "Budgets enregistrés.");
    }
    if (kind === "split") {
      ["besoins", "envies", "epargne"].forEach(function (g) { state.split[g] = Math.min(100, Math.max(0, Number(fd.get("split-" + g)) || 0)); });
      save();
      return flashOk("split", "Répartition enregistrée.");
    }
    if (kind === "exp") {
      var a = Number(fd.get("amount"));
      if (!label) return setMsg("msg-exp", "Dis pour quoi est cette dépense.");
      if (!(a > 0)) return setMsg("msg-exp", "Entre un montant supérieur à 0.");
      state.expenses.push({ id: uid(), label: label, amount: a, cat: String(fd.get("cat")), date: newExpenseDate() });
      save();
    } else if (kind === "due") {
      var da = Number(fd.get("amount")), dd = Math.floor(Number(fd.get("day")));
      if (!label) return setMsg("msg-due", "Donne un nom à cette échéance.");
      if (!(da > 0)) return setMsg("msg-due", "Entre un montant supérieur à 0.");
      if (!(dd >= 1 && dd <= 31)) return setMsg("msg-due", "Le jour doit être entre 1 et 31.");
      state.dues.push({ id: uid(), label: label, amount: da, day: dd, cat: String(fd.get("cat")) });
      save();
    } else if (kind === "goal") {
      var tg = Number(fd.get("target")), sv = Number(fd.get("saved") || 0), dt = String(fd.get("date") || "");
      if (!label) return setMsg("msg-goal", "Dis ce que tu veux financer.");
      if (!(tg > 0)) return setMsg("msg-goal", "Entre le montant visé.");
      if (!dt) return setMsg("msg-goal", "Choisis une date.");
      state.goals.push({ id: uid(), label: label, target: tg, saved: Math.max(0, sv), date: dt });
      save();
    }
  }

  document.addEventListener("change", function (ev) {
    var t = ev.target.closest("[data-field]");
    if (!t) return;
    var v = Math.max(0, Number(t.value) || 0);
    if (t.dataset.field === "income") state.income = v;
    else if (t.dataset.field.indexOf("split-") === 0) state.split[t.dataset.field.slice(6)] = Math.min(100, v);
    else if (t.dataset.field.indexOf("cb-") === 0) { state.catBudgets = state.catBudgets || {}; state.catBudgets[t.dataset.field.slice(3)] = v; }
    save();
  });

  /* ---------- start ---------- */
  try {
    var raw = localStorage.getItem(LS);
    if (raw) {
      var l = JSON.parse(raw);
      if (l && l.v === 1) { state = l; if (!state.catBudgets) state.catBudgets = {}; }
    }
  } catch (e) {}
  render();
  modeNote();
})();
</script>
